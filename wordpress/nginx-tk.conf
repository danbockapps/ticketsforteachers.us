# WordPress trial vhost — tk.danbock.net
# One-time setup on the VPS:
#
#   1. DNS: A record  tk.danbock.net -> 178.156.142.199
#   2. Install:  sudo cp nginx-tk.conf /etc/nginx/sites-available/tk.danbock.net
#                sudo ln -s /etc/nginx/sites-available/tk.danbock.net /etc/nginx/sites-enabled/
#   3. IMPORTANT: comment out the entire `listen 443` server block below
#      (the cert doesn't exist yet), then:
#                sudo nginx -t && sudo systemctl reload nginx
#   4. Cert:  sudo certbot certonly --nginx -d tk.danbock.net
#   5. Uncomment the 443 server block, then:
#                sudo nginx -t && sudo systemctl reload nginx
#
# This is a separate server block; it does not touch ticketsforteachers.us.

server {
    listen 80;
    listen [::]:80;
    server_name tk.danbock.net;
    # certbot --nginx will add a redirect to https here    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tk.danbock.net;

    # Adjust paths if your certs live elsewhere.
    ssl_certificate     /etc/letsencrypt/live/tk.danbock.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tk.danbock.net/privkey.pem;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
